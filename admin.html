<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostTrack - Painel Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .box { background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px; width: 100%; max-width: 500px; margin-bottom: 20px; box-sizing: border-box; }
    input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    button { background: #0095f6; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0077c5; }
    button.btn-danger { background: #ed4956; }
    button.btn-danger:hover { background: #c12a36; }
    .post-item { border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-box" class="box">
    <h2>PostTrack - Login Admin</h2>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
    <p id="login-erro" style="color: #ed4956; font-size: 13px;"></p>
  </div>

  <!-- PAINEL CRUD -->
  <div id="admin-panel" class="box hidden">
    <h2>Gerenciar Publicações</h2>
    <input type="hidden" id="post-id">
    <input type="text" id="titulo" placeholder="Título">
    <input type="text" id="autor" placeholder="Autor">
    <input type="text" id="data" placeholder="Data (ex: 24/09/2026)">
    <textarea id="descricao" placeholder="Descrição do post..."></textarea>
    <input type="text" id="imagens" placeholder="URLs das imagens (separadas por vírgula)">
    
    <button id="btn-salvar" onclick="salvarPost()">Publicar</button>
    <button onclick="limparFormulario()" style="background: #555;">Cancelar / Novo</button>
    <button onclick="fazerLogout()" class="btn-danger" style="margin-top: 15px;">Sair</button>

    <hr style="border-color: #333; margin: 20px 0;">

    <h3>Lista de Posts</h3>
    <div id="lista-posts"></div>
  </div>

  <script>
    // CONFIGURAÇÃO DO SUPABASE
    const SUPABASE_URL = "https://sovybkcqlmtznorhqdap.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvdnlia2NxbG10em5vcmhxZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyODU5OTYsImV4cCI6MjEwNTg2MTk5Nn0.7QmukKLyEMRSr0Q2KcpvSizsuUC7xz4EYCo4OEaBK90";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) mostrarPainel();
    });

    async function fazerLogin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("senha").value;
      
      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        document.getElementById("login-erro").innerText = "Acesso negado: " + error.message;
      } else {
        mostrarPainel();
      }
    }

    async function fazerLogout() {
      await _supabase.auth.signOut();
      location.reload();
    }

    function mostrarPainel() {
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("admin-panel").classList.remove("hidden");
      carregarPostsAdmin();
    }

    async function salvarPost() {
      const id = document.getElementById("post-id").value;
      const titulo = document.getElementById("titulo").value;
      const autor = document.getElementById("autor").value;
      const dataFormatada = document.getElementById("data").value;
      const descricao = document.getElementById("descricao").value;
      const imagensStr = document.getElementById("imagens").value;
      
      const imagensArray = imagensStr ? imagensStr.split(",").map(url => url.trim()) : [];

      const payload = { 
        titulo, 
        autor, 
        data: dataFormatada, 
        descricao, 
        imagens: JSON.stringify(imagensArray) 
      };

      if (id) {
        await _supabase.from("posts").update(payload).eq("id", id);
      } else {
        await _supabase.from("posts").insert([payload]);
      }

      limparFormulario();
      carregarPostsAdmin();
    }

    async function carregarPostsAdmin() {
      const { data: posts, error } = await _supabase.from("posts").select("*").order("id", { ascending: false });
      const lista = document.getElementById("lista-posts");
      lista.innerHTML = "";

      if (posts) {
        posts.forEach(p => {
          const div = document.createElement("div");
          div.className = "post-item";
          div.innerHTML = `
            <div>
              <strong>${p.titulo || 'Sem título'}</strong> <br>
              <small>${p.data || ''}</small>
            </div>
            <div>
              <button onclick='editarPost(${JSON.stringify(p)})' style="padding: 4px 8px; font-size: 12px;">Editar</button>
              <button onclick='deletarPost(${p.id})' class="btn-danger" style="padding: 4px 8px; font-size: 12px;">Excluir</button>
            </div>
          `;
          lista.appendChild(div);
        });
      }
    }

    function editarPost(post) {
      document.getElementById("post-id").value = post.id;
      document.getElementById("titulo").value = post.titulo || '';
      document.getElementById("autor").value = post.autor || '';
      document.getElementById("data").value = post.data || '';
      document.getElementById("descricao").value = post.descricao || '';
      
      let imgs = [];
      try {
        imgs = typeof post.imagens === "string" ? JSON.parse(post.imagens) : post.imagens;
      } catch(e) {
        imgs = [];
      }
      
      document.getElementById("imagens").value = Array.isArray(imgs) ? imgs.join(", ") : '';
      document.getElementById("btn-salvar").innerText = "Atualizar Post";
    }

    async function deletarPost(id) {
      if (confirm("Tem certeza que deseja excluir esta publicação?")) {
        await _supabase.from("posts").delete().eq("id", id);
        carregarPostsAdmin();
      }
    }

    function limparFormulario() {
      document.getElementById("post-id").value = "";
      document.getElementById("titulo").value = "";
      document.getElementById("autor").value = "";
      document.getElementById("data").value = "";
      document.getElementById("descricao").value = "";
      document.getElementById("imagens").value = "";
      document.getElementById("btn-salvar").innerText = "Publicar";
    }
  </script>
</body>
</html>
